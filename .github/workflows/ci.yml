name: Continuous Integration

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['**']

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build and Test
    strategy:
      matrix:
        os: [ubuntu-latest]
        scala: [2.13.18, 2.12.21, 3.3.9]
        java: [temurin@21]
        platform: [jvm, js]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java (temurin@21)
        if: matrix.java == 'temurin@21'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Node.js
        if: matrix.platform == 'js'
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Check formatting
        if: matrix.platform == 'jvm'
        run: sbt '++ ${{ matrix.scala }}; scalafmtCheckAll; rootJS/scalafmtCheckAll; scalafmtSbtCheck'

      - name: Check that workflows are up to date
        run: sbt '++ ${{ matrix.scala }}; githubWorkflowCheck'

      - name: Build project (JVM)
        if: matrix.platform == 'jvm'
        run: sbt '++ ${{ matrix.scala }}; test'

      - name: Build project (Scala.js)
        if: matrix.platform == 'js'
        run: sbt '++ ${{ matrix.scala }}; rootJS/test'

      - name: Generate Code Coverage Reports
        if: matrix.scala == '2.13.18' && matrix.platform == 'jvm'
        run: sbt '++ ${{ matrix.scala }}; clean; coverage; test'

      - name: Aggregate Code Coverage Report
        if: matrix.scala == '2.13.18' && matrix.platform == 'jvm'
        run: sbt '++ ${{ matrix.scala }}; coverageAggregate'

      - name: Upload Code Coverage Report
        if: matrix.scala == '2.13.18' && matrix.platform == 'jvm'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
